<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Portal de Contracheques</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background:#f2f4f7; padding:40px; }
    .container { max-width:420px; margin:auto; background:#fff; padding:25px; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
    h2 { text-align:center; }
    input, button { width:100%; padding:12px; margin-top:12px; }
    button { background:#2563eb; color:#fff; border:none; border-radius:4px; cursor:pointer; }
    .msg { margin-top:15px; text-align:center; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Contracheque</h2>
    <input id="matricula" placeholder="Matrícula">
    <input id="nome" placeholder="Nome completo">
    <button onclick="buscar()">Buscar</button>
    <div class="msg" id="msg"></div>
  </div>

<script>
function normalizar(t){
  return t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"_").toUpperCase();
}
async function buscar(){
  const m = matricula.value.trim();
  const n = normalizar(nome.value.trim());
  const msg = document.getElementById("msg");
  msg.innerText = "Buscando...";
  const r = await fetch("/data/contracheques.json");
  const d = await r.json();
  if(!d[m] || d[m].nome !== n){ msg.innerText="Dados não encontrados"; return; }
  const meses = Object.keys(d[m].arquivos).sort();
  const mes = meses[meses.length-1];
  msg.innerHTML = `<a href="${d[m].arquivos[mes]}" target="_blank">Baixar contracheque (${mes})</a>`;
}
</script>
</body>
</html>
