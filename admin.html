<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin - Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family:Arial; background:#f9fafb; padding:40px; }
    .container { max-width:480px; margin:auto; background:#fff; padding:25px; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
    input, button { width:100%; padding:12px; margin-top:12px; }
    button { background:#16a34a; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  </style>
</head>
<body>
<div class="container">
<h2>Upload de Contracheque</h2>
<input id="matricula" placeholder="Matrícula">
<input id="nome" placeholder="Nome completo">
<input id="mes" placeholder="Mês (ex: 2026-05)">
<input type="file" id="file" accept="application/pdf">
<button onclick="enviar()">Enviar</button>
<p id="status"></p>
</div>

<script>
function normalizar(t){
  return t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"_").toUpperCase();
}
function toBase64(f){
  return new Promise(r=>{const rd=new FileReader(); rd.onload=()=>r(rd.result.split(',')[1]); rd.readAsDataURL(f);});
}
async function enviar(){
  const f = file.files[0];
  if(!f){ alert("Selecione um PDF"); return; }
  status.innerText="Enviando...";
  const b64 = await toBase64(f);
  const res = await fetch("/api/upload",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      matricula: matricula.value.trim(),
      nome: normalizar(nome.value.trim()),
      mes: mes.value.trim(),
      arquivo: b64
    })
  });
  const j = await res.json();
  status.innerText = j.message || "Concluído";
}
</script>
</body>
</html>
